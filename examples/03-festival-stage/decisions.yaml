eventml: "0.2"
kind: decisions
project: festival-stage
---
decisions:
  - id: d-foh-ground-run
    date: 2026-05-08
    by: { party: production, person: "production manager" }
    decision: "The stage-to-front-of-house link runs along the ground under cable mats where it crosses the public path."
    why: "the site manager offered mats on the walk-round, and it is what the food stalls do"
    alternatives:
      - { option: "route the long way round the tree line", why_not: "adds roughly 40 m and a second fibre join" }
    affects: [c-mc-mc, brief.venue.cable_route]
    src: s-venue-mats
    notes: >-
      Recorded the same day the council representative spoke against it, in the same conversation. A
      spoken objection from one person on a walk-round is not yet the council's position, so the mats plan
      stood until that position was confirmed — which is what d-foh-catenary records, twelve days later.

  - id: d-foh-catenary
    date: 2026-05-20
    by: { party: production, person: "production manager" }
    decision: "The stage-to-front-of-house link is flown on a catenary at 5.2 m where it crosses the public path."
    why: >-
      The council prohibits any ground run across a public path for the duration of the festival, matted
      or not. Flying it is the only route that keeps the 60 m fibre in one piece
    alternatives:
      - { option: "ground run under mats", why_not: "prohibited by the council; this decision supersedes d-foh-ground-run" }
      - { option: "route the long way round the tree line", why_not: "adds a fibre join in a field with no lighting" }
    affects: [c-mc-mc, brief.venue.cable_route]
    src: s-council-paths
    supersedes: d-foh-ground-run
    needs_agreement: true
    notes: >-
      The two statements behind this conflict came from different people on the same site visit, which is
      why `sources` holds them as separate entries. Without that split this decision could not cite the
      council rather than the site manager, and the record would not say who overruled whom. The twelve
      days between the two decisions are the time it took to confirm the walk-round objection was the
      council's actual position and to work out a route that satisfied it, not a delay in believing it.
      `s-council-paths` is a prohibition, not a permission: the council representative said no cable may
      run on the ground, and said nothing at all about a catenary at 5.2 m. The team solved the problem the
      council raised and never went back to ask whether the solution is acceptable to them, which is why
      this decision carries `needs_agreement: true` and no `agreed_by` — the council is the party that can
      stop the show on the day, and closing that loop is still outstanding. That is a common and realistic
      way a project fails: the objection gets engineered around, the fix looks obviously right to the
      people who found it, and nobody circles back to the one party whose sign-off actually counts.

  - id: d-generator-position
    date: 2026-05-20
    by: { party: production, person: "system engineer" }
    decision: "The generator stays behind the tree line at 70 m, and the long supply run is accepted."
    why: >-
      The site visit established that noise is acceptable at 70 m behind the tree line, at the cost of a
      long supply run. The system engineer's judgement is that noise at the audience area governs the
      placement more than the run length does, and that a closer position risks being audible there.
    alternatives:
      - { option: "move the generator 30 m closer", why_not: "the system engineer judges this would be audible from the audience area during quiet passages between songs; the site visit checked only the 70 m position" }
    affects: [c-gen-rcd, c-gen-rcd16, gen-1]
    src: s-site-visit
