eventml: "0.4"
layer: brief
project: festival-stage
---
brief:
  name: Second stage, town festival
  date: 2026-06-20

  sources:
    - id: s-client-brief
      kind: email
      date: 2026-04-11
      from: client
      subject: "Second stage, town festival — same as last year"
      excerpt: >-
        We're running the second stage at the town festival again, in the park by the river. Four bands
        through the afternoon and evening, headliner at 21:00, finish by 23:00. Last year the sound was
        fine but the stage looked flat on the photos and you couldn't see anything after dark. There's a
        video screen this year. No mains anywhere near, we hire a generator as usual.
    - id: s-site-visit
      kind: site_visit
      date: 2026-05-08
      from: production
      sender: "production manager"
      excerpt: >-
        Walked the site. Generator position is behind the trees, roughly 70 m from the stage — noise is
        fine there but that is a long cable run. Front of house is 45 m out from the stage, past the
        crowd barrier. No cable route on the ground between them that does not cross a public path.
    - id: s-cable-question
      kind: call
      date: 2026-05-08
      from: production
      sender: "production manager"
      excerpt: >-
        Asked on the walk-round, with the site manager and the council representative both present,
        whether we may run cable across the public path between front of house and the stage.
    - id: s-venue-mats
      kind: site_visit
      date: 2026-05-08
      from: venue
      sender: "site manager"
      answers: [s-cable-question]
      excerpt: >-
        Said we can run cable across the path if we mat it — that is what the food stalls do.
    - id: s-council-paths
      kind: site_visit
      date: 2026-05-08
      from: authority
      sender: "council representative"
      answers: [s-cable-question]
      excerpt: >-
        Stated that no cable may run across a public path, matted or not, for the duration of the
        festival. Said this in front of the site manager, who had just offered the opposite.
    - id: s-headliner-rider
      kind: rider
      date: 2026-05-20
      from: performer
      sender: "headliner's tour manager"
      subject: "Headliner — technical rider, summer 2026"
      excerpt: >-
        Six on stage: drums, bass, two guitars, keys and lead vocal. Six monitor mixes, wedges only, no
        in-ears. Two channels of radio microphone for the singer. House to supply four vocal microphones
        and a DI for the keys. We carry our own backline.

  needs:
    - id: n-four-bands
      text: "Four bands through the afternoon and evening, headliner at 21:00, finish by 23:00"
      src: { id: s-client-brief, exact: "Four bands through the afternoon and evening, headliner at 21:00, finish by 23:00", start: 85, end: 166 }

    - id: n-park
      text: "in the park by the river"
      src: { id: s-client-brief, exact: "in the park by the river", start: 59, end: 83 }
      notes: >-
        Refined by nothing, and question rule 8 reports it. The park is where the event is, not something
        the system must achieve — one of the two readings a person has to choose between when the rule
        fires.

    - id: n-flat-photos
      text: "the stage looked flat on the photos and you couldn't see anything after dark"
      src: { id: s-client-brief, exact: "the stage looked flat on the photos and you couldn't see anything after dark", start: 201, end: 277 }
      notes: >-
        A lighting requirement stated as a complaint about photographs. It refines into face lighting and
        stage wash, neither of which the client would name — which is why the client's words and ours are
        kept at different levels.

    - id: n-screen
      text: "There's a video screen this year."
      src: { id: s-client-brief, exact: "There's a video screen this year.", start: 279, end: 312 }

    - id: n-generator
      text: "No mains anywhere near, we hire a generator as usual."
      src: { id: s-client-brief, exact: "No mains anywhere near, we hire a generator as usual.", start: 313, end: 366 }

    - id: n-generator-position
      text: "Generator position is behind the trees, roughly 70 m from the stage"
      src: { id: s-site-visit, exact: "Generator position is behind the trees, roughly 70 m from the stage", start: 17, end: 84 }
      value: 70

    - id: n-foh-distance
      text: "Front of house is 45 m out from the stage"
      src: { id: s-site-visit, exact: "Front of house is 45 m out from the stage", start: 137, end: 178 }
      value: 45

    - id: n-cable-route
      text: "we can run cable across the path if we mat it"
      src: { id: s-venue-mats, exact: "we can run cable across the path if we mat it", start: 5, end: 50 }
      value:
        state: conflicting
        alternatives:
          - { value: "ground run with mats across the path", src: s-venue-mats }
          - { value: "no ground run permitted on public paths", src: s-council-paths }
        notes: >-
          Both statements answer `s-cable-question`, put to the two of them on the same walk-round. The
          thread branches here, and the branch is the disagreement. Resolved by `d-foh-catenary`; the value
          stays conflicting because both statements were made.

    - id: n-headliner-size
      text: "Six on stage"
      src: { id: s-headliner-rider, exact: "Six on stage", start: 0, end: 12 }
      value: 6

    - id: n-monitor-mixes
      text: "Six monitor mixes, wedges only, no in-ears."
      src: { id: s-headliner-rider, exact: "Six monitor mixes, wedges only, no in-ears.", start: 61, end: 104 }
      value: 6

    - id: n-radio-mics
      text: "Two channels of radio microphone for the singer."
      src: { id: s-headliner-rider, exact: "Two channels of radio microphone for the singer.", start: 105, end: 153 }
      value: 2

  audience:
    value: 1500
    state: stated
    src: s-client-brief

  venue:
    name: "Riverside park, second stage"
    covered:
      value: true
      state: stated
      src: s-client-brief
      notes: "stage roof; the audience area is open"
    foh_distance_m:
      value: 45
      state: stated
      src: s-site-visit
    generator_distance_m:
      value: 70
      state: stated
      src: s-site-visit
    cable_route:
      state: conflicting
      alternatives:
        - { value: "ground run with mats across the path", src: s-venue-mats }
        - { value: "no ground run permitted on public paths", src: s-council-paths }
      notes: >-
        Both said on the same site visit, by different people — the site manager offered mats, the council
        representative present said no. Recorded as conflicting rather than resolved by whoever spoke
        last. The two statements are separate `sources` entries precisely so the conflict can name who
        said what; a single entry for the visit would have left both alternatives pointing at the same
        `src` and the question unanswerable. The conflict is resolved by `d-foh-catenary`, and the value
        stays conflicting because both statements were made and the record of which one won belongs in the
        decision, not here.

  power:
    source: generator
    rating:
      value: "20 kVA three-phase"
      state: assumed
      why: "what was hired last year; the video screen is new and may change it"
      ask: true

  program:
    - id: b-changeovers
      what: Four bands with changeovers
      bands: 4
      changeover_minutes:
        value: 20
        state: assumed
        why: "four bands between 16:00 and 23:00 leaves about that much"

    - id: b-headliner
      at: "21:00"
      what: Headliner
      size:
        value: 6
        state: stated
        src: s-client-brief
      wireless_channels:
        state: unknown
        notes: >-
          The headliner's rider gives two channels — `n-radio-mics`. The other three bands' riders have not
          arrived, and frequency coordination needs the total, so the aggregate is still unknown.

    - id: b-lighting
      what: Stage lighting after dark
      brief_quote: "the stage looked flat on the photos and you couldn't see anything after dark"
      dark_from:
        value: "20:45"
        state: derived
        why: "sunset plus civil twilight for the date and latitude"

    - id: b-screen
      what: Video screen beside the stage
      screen_type:
        value: "LED wall"
        state: assumed
        why: "outdoor, daylight, 1500 people — projection will not carry"
        ask: true
      content:
        state: unknown
        notes: "camera of the stage, sponsor loops, or both — nobody has said"

  stated_preferences:
    - value: "Last year the sound was fine but the stage looked flat on the photos."
      state: stated
      src: s-client-brief
      notes: >-
        A lighting requirement stated as a complaint about photographs. It refines into face lighting and
        stage wash, neither of which the client would name.
